name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  connector-test:
    runs-on: ubuntu-latest
    env:
      BATON_CREDENTIALS_JSON: ${{ secrets.BATON_CREDENTIALS_JSON }}
      BATON_CUSTOMER_ID: ${{ secrets.BATON_CUSTOMER_ID }}
      BATON_ADMINISTRATOR_EMAIL: ${{ secrets.BATON_ADMINISTRATOR_EMAIL }}
      BATON_DOMAIN: ${{ secrets.BATON_DOMAIN }}
      BATON_LOG_LEVEL: debug
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build connector
        run: go build -o baton-google-workspace ./cmd/baton-google-workspace
      - name: Test connector capabilities
        run: |
          ./baton-google-workspace capabilities
      - name: Test connector sync
        run: |
          ./baton-google-workspace --file /tmp/sync-test.c1z
      - name: Install baton CLI
        uses: ConductorOne/github-workflows/actions/get-baton@v4
      - name: Test change user org unit action
        env:
          TARGET_ORG_UNIT: ${{ vars.TARGET_ORG_UNIT }}
        run: ./scripts/test-org-unit-change.sh
      - name: Test create group action
        run: ./scripts/test-create-group.sh
      - name: Test offboarding profile update action
        run: ./scripts/test-offboarding-profile-update.sh
      - name: Test modify group settings action
        run: ./scripts/test-modify-group-settings.sh
      - name: Test update user manager action
        run: ./scripts/test-update-user-manager.sh
      - name: Select unique provisioning identity
        id: provisioning_identity
        env:
          BASE_EMAIL: ${{ vars.PRIMARY_EMAIL }}
        run: |
          set -euo pipefail
          if [[ "$BASE_EMAIL" != *@* ]]; then
            echo "PRIMARY_EMAIL must be an email address" >&2
            exit 1
          fi
          local_part="${BASE_EMAIL%@*}"
          domain="${BASE_EMAIL#*@}"
          printf 'email=%s-%s-%s@%s\n' "${local_part:0:32}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$domain" >> "$GITHUB_OUTPUT"
      - name: Test account provisioning
        uses: ConductorOne/github-workflows/actions/account-provisioning@v3
        with:
          connector: ./baton-google-workspace
          account-email: "${{ steps.provisioning_identity.outputs.email }}"
          account-profile: '{"email":"${{ steps.provisioning_identity.outputs.email }}","given_name":"${{ vars.GIVEN_NAME }}","family_name":"${{ vars.FAMILY_NAME }}"}'
          sleep: 40
